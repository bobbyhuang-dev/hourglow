name: Feature request
description: Suggest an improvement to HourGlow.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/bobbyhuang-dev/hourglow/issues?q=is%3Aissue) before opening a new request.
        Read the [project's non-goals](https://github.com/bobbyhuang-dev/hourglow/blob/main/CONTRIBUTING.md#non-goals). If your idea changes one of those boundaries, explain why the trade-off should change.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to do and where HourGlow falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe how you would expect this to work in the menu bar app or CLI.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Include any current workaround or other approach you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Add examples or mockups, or explain why an existing non-goal should be reconsidered.
