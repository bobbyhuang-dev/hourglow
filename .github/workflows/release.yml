# Publish on tags: v1.0.0 → build, verify, archive, and create a GitHub Release.
#
#   git tag -a v1.0.0 -m "HourGlow 1.0.0" && git push origin v1.0.0
#
# Artifacts are ad-hoc signed (no developer account, so no notarization). The first launch after download
# requires clearing the quarantine hurdle; the release notes explain how.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.0'
        required: true

permissions:
  contents: write        # Required to create a release.

jobs:
  release:
    name: Verify release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Build
        env:
          HOURGLOW_VERSION: ${{ steps.version.outputs.version }}
          HOURGLOW_BUILD: ${{ github.run_number }}
        run: ./build.sh

      - name: Verify universal binaries and signing identity
        run: bash Tests/verify-universal.sh

      # Run the same checks as CI before publishing: a successful build does not guarantee correct calculations.
      - name: Run verification targets
        env:
          HOURGLOW_HOME: ${{ runner.temp }}/hourglow-home
        run: |
          ./build/modelcheck
          ./build/enginecheck
          ./build/importcheck
          ./build/appcheck
          ./build/appstartupcheck
          ./build/panelvisibilitycheck
          ./build/updatecheck
          python3 Tests/verify-updater-location.py
          ./build/l10ncheck Sources
          bash Tests/verify-updater-helper.sh build/HourGlow.app/Contents/Helpers/HourGlowUpdater

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compare sunrise and sunset against an ephemeris
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ephem
          python3 Tests/verify-solar.py
          python3 Tests/verify-cli-boundaries.py

      # Use ditto rather than zip to preserve bundle symlinks and extended attributes.
      # Archiving the .app with zip breaks its signature after extraction.
      - name: Create archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/HourGlow.app "dist/HourGlow-$VERSION.zip"
          # The CLI is a standalone binary, so zip suffices; ditto's --sequesterRsrc would add an unnecessary __MACOSX directory.
          (cd build && zip -qj "$GITHUB_WORKSPACE/dist/hourglow-cli-$VERSION.zip" hourglow-cli)
          cd dist && shasum -a 256 ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Verify archived app signature
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rm -rf "$RUNNER_TEMP/verify" && mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "dist/HourGlow-$VERSION.zip" "$RUNNER_TEMP/verify"
          ditto -x -k "dist/hourglow-cli-$VERSION.zip" "$RUNNER_TEMP/verify"
          bash Tests/verify-universal.sh "$RUNNER_TEMP/verify/HourGlow.app" "$RUNNER_TEMP/verify/hourglow-cli"
          HOURGLOW_HOME="$RUNNER_TEMP/release-smoke" TZ=Asia/Shanghai "$RUNNER_TEMP/verify/hourglow-cli" list
          HOURGLOW_HOME="$RUNNER_TEMP/release-smoke" TZ=Asia/Shanghai "$RUNNER_TEMP/verify/hourglow-cli" simulate 2026-12-21
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$RUNNER_TEMP/verify/HourGlow.app/Contents/Info.plist"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > "dist/notes.md" <<NOTES
          A macOS menu bar wallpaper scheduler that follows the daylight.

          ## Install

          1. Download **HourGlow-$VERSION.zip**, unzip it, drag \`HourGlow.app\` into \`/Applications\`.
          2. The app is ad-hoc signed, not notarized, so the first launch is blocked. Either run

             \`\`\`bash
             xattr -dr com.apple.quarantine /Applications/HourGlow.app
             \`\`\`

             or open it once, then go to **System Settings › Privacy & Security › Open Anyway**.
          3. It lives in the menu bar — no Dock icon, no window.

          HourGlow checks GitHub Releases for future updates once a day. You can turn automatic
          updates off or run a manual check from its settings page.

          Universal 2: supports Apple silicon and Intel Macs running macOS 26 (Tahoe) or later.

          **hourglow-cli-$VERSION.zip** is the optional command line tool (troubleshooting + headless daemon).

          Checksums are in \`SHA256SUMS.txt\`.
          NOTES
          cat "dist/notes.md"

      - name: Upload verified release assets
        if: matrix.os == 'macos-26'
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish after both architectures pass
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "HourGlow ${TAG#v}" \
            --notes-file dist/notes.md \
            --generate-notes \
            dist/*.zip dist/SHA256SUMS.txt
