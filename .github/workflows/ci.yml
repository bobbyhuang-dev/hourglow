# Run on every push and PR: build, pass verification targets, and compare sunrise/sunset against an ephemeris.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify
    runs-on: macos-26      # LSMinimumSystemVersion is 26.0, requiring the Tahoe SDK.
    steps:
      - uses: actions/checkout@v5

      # Runners often have several Xcode versions; select the newest rather than relying on the default.
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          swift --version

      - name: Build
        run: ./build.sh

      # Default ad-hoc signing uses the cdhash as identity, which changes with every rebuild.
      # This can disrupt macOS 26 menu bar permission for new versions, so verify the stable requirement separately.
      - name: Verify app signing identity
        run: bash Tests/verify-app-signature.sh build/HourGlow.app

      # Targets avoid real configuration (ModelCheck redirects HOURGLOW_HOME itself).
      # Add another safeguard here so all runner writes stay in a temporary directory.
      - name: Run verification targets
        env:
          HOURGLOW_HOME: ${{ runner.temp }}/hourglow-home
        run: |
          ./build/modelcheck
          ./build/enginecheck
          ./build/importcheck
          ./build/appcheck
          ./build/appstartupcheck
          ./build/panelvisibilitycheck
          ./build/updatecheck
          python3 Tests/verify-updater-location.py
          # Include Sources to check hardcoded keys against the source catalog as well as checking the catalogs themselves.
          ./build/l10ncheck Sources
          bash Tests/verify-updater-helper.sh build/HourGlow.app/Contents/Helpers/HourGlowUpdater

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compare sunrise and sunset against an ephemeris
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ephem
          python3 Tests/verify-solar.py
          python3 Tests/verify-cli-boundaries.py

      # Run only computational subcommands: the runner has no aerial assets or wallpaper configuration,
      # so catalog / now / status, which read system files, are not useful here.
      #
      # TZ must name a real city: runners use UTC, which has no coordinates in zone.tab.
      # Without explicit coordinates, solar-related subcommands correctly report no coordinates and exit 1.
      - name: Smoke-test CLI
        env:
          HOURGLOW_HOME: ${{ runner.temp }}/hourglow-cli-home
          TZ: Asia/Shanghai
        run: |
          ./build/hourglow-cli list
          ./build/hourglow-cli solar
          ./build/hourglow-cli cities 深圳
          ./build/hourglow-cli simulate 2026-12-21
          # Exercise every language: l10ncheck catches missing strings and placeholder errors,
          # while actual execution catches language-specific CLI crashes.
          # Derive languages from the catalogs, just as build.sh generates CFBundleLocalizations,
          # so adding a language does not require updating this workflow.
          for lang in $(grep -h -o 'code: "[^"]*"' Sources/L10n/Catalogs/*.swift \
                        | sed -e 's/code: "//' -e 's/"//'); do
            HOURGLOW_LANG="$lang" ./build/hourglow-cli language
            HOURGLOW_LANG="$lang" ./build/hourglow-cli list
            HOURGLOW_LANG="$lang" ./build/hourglow-cli simulate 2026-12-21
            HOURGLOW_LANG="$lang" ./build/hourglow-cli help
          done
